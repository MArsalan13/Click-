<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>The Red Button Home</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f20d0d",
                        "background-light": "#f8f5f5",
                        "background-dark": "#221010",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            overflow: hidden;
        }
        .neo-button {
            box-shadow: 0 10px 0 0 #8b0000, 0 20px 40px rgba(242, 13, 13, 0.3);
            transition: all 0.1s ease;
        }
        .neo-button:active {
            transform: translateY(8px);
            box-shadow: 0 2px 0 0 #8b0000, 0 10px 20px rgba(242, 13, 13, 0.2);
        }
        .inner-glow {
            box-shadow: inset 0 2px 10px rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-zinc-900 dark:text-zinc-100 min-h-screen flex items-center justify-center transition-colors duration-500">
<!-- Subtle Grain Background Overlay -->
<div class="fixed inset-0 pointer-events-none opacity-[0.03] dark:opacity-[0.05] z-0">
<img class="w-full h-full object-cover" data-alt="Fine subtle dark noise texture background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCNSgc5GViTn-kFhzpwOh0WPaWGF75WpbqPfAPsbxjs3kM3oueFd10eQmiTp5Hrd7l2oC2dVHvA5bOTJAbV6J2Fa4aEuavm2iTw0LzDiC7auSuwZoWxb5RtMGyCkJS2Q7h2dUFL9CQtya2sDgundYZFGSknj5mdnG7Qj_3MAF1jrFGdXlV_U7yi-rPaCZjBmTlShQiB9cHuKzo7uJKf_y3HOLwNJwJt07sMVHMRLg3K-lR2kySY6NYNGMOZsx_RpWSJrgV3KRaTU8TA"/>
</div>
<!-- Main Container -->
<main class="relative z-10 flex flex-col items-center justify-center text-center p-6 w-full max-w-2xl mx-auto">
<!-- Header Section -->
<header class="mb-16 md:mb-24">
<h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-4 text-zinc-800 dark:text-white">
                Don't think, <span class="text-primary">just click.</span>
</h1>
<p class="text-zinc-500 dark:text-zinc-400/60 font-medium tracking-wide text-sm md:text-base uppercase">
                The ultimate interaction experiment
            </p>
</header>
<!-- Central Interaction Area -->
<div class="relative group">
<!-- Pulsing Ambient Glow -->
<div class="absolute -inset-8 bg-primary/20 rounded-full blur-3xl opacity-50 group-hover:opacity-100 transition-opacity duration-700"></div>
<!-- The Red Button -->
<button class="neo-button inner-glow relative w-48 h-48 md:w-64 md:h-64 bg-primary rounded-full flex items-center justify-center cursor-pointer group focus:outline-none focus:ring-4 focus:ring-primary/40">
<div class="w-full h-full rounded-full border-4 border-white/10 flex items-center justify-center overflow-hidden">
<!-- Subtle Surface Gradient -->
<div class="absolute inset-0 bg-gradient-to-tr from-black/20 via-transparent to-white/20"></div>
<!-- Icon or Symbol -->
<span class="material-icons text-6xl md:text-8xl text-white/90 drop-shadow-lg select-none">
                        touch_app
                    </span>
</div>
</button>
</div>
<!-- Footer / Feedback Section -->
<footer class="mt-24 md:mt-32">
<div class="flex flex-col items-center gap-4">
<div class="flex items-center gap-2 px-6 py-2 bg-zinc-200 dark:bg-primary/10 rounded-full border border-zinc-300 dark:border-primary/20">
<span class="w-2 h-2 bg-primary rounded-full"></span>
<span class="text-xs md:text-sm font-semibold tracking-wider text-zinc-600 dark:text-primary/80 uppercase">
                        System Online
                    </span>
</div>
<p class="text-zinc-400 dark:text-zinc-500 text-xs mt-4">
                    Pressing the button may cause extreme satisfaction.
                </p>
</div>
</footer>
</main>
<!-- Background Decorative Elements -->
<div class="fixed top-10 left-10 opacity-10 dark:opacity-20 select-none pointer-events-none">
<span class="text-8xl font-black text-primary/30">01</span>
</div>
<div class="fixed bottom-10 right-10 opacity-10 dark:opacity-20 select-none pointer-events-none">
<span class="material-icons text-[120px] text-zinc-500 dark:text-zinc-700">radio_button_checked</span>
</div>
<!-- Screen Vignette -->
<div class="fixed inset-0 pointer-events-none bg-radial-gradient from-transparent via-transparent to-black/10 dark:to-black/40"></div>
</body></html>
